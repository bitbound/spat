name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Create a beta pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      # Must match ReleaseAssetSelector.AssetName in Spat.Libraries.Updater. A unit test asserts it.
      ASSET_NAME: spat-x64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Date).ToUniversalTime().ToString('yyyy.M.d')
          if ('${{ inputs.prerelease }}' -eq 'true') {
            $ver += '-beta'
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Publish single-file executable
        run: >-
          dotnet publish Spat/Spat.csproj
          --configuration Release
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Publish NativeAOT executable
        run: >-
          dotnet publish Spat/Spat.csproj
          --configuration Release
          -p:PublishProfile=nativeaot
          -p:Version=${{ steps.version.outputs.version }}

      - name: Package NativeAOT archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path Spat/bin/Release/publish/nativeaot/spat.exe, `
                  Spat/bin/Release/publish/nativeaot/av_libglesv2.dll, `
                  Spat/bin/Release/publish/nativeaot/libSkiaSharp.dll, `
                  Spat/bin/Release/publish/nativeaot/libHarfBuzzSharp.dll `
            -DestinationPath ./spat-windows-x64-aot.zip

      - name: Prepare release asset
        shell: pwsh
        run: |
          # The in-app updater downloads this asset and runs it under this exact name, so the
          # published file must be $env:ASSET_NAME with the .exe extension.
          Rename-Item ./artifacts/spat.exe $env:ASSET_NAME

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $releaseArgs = @(
            $env:TAG,
            "./artifacts/$env:ASSET_NAME",
            './spat-windows-x64-aot.zip',
            '--title', $env:TAG,
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') {
            $releaseArgs += '--prerelease'
          }
          gh release create @releaseArgs
