name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build tests
        run: dotnet build tests/Spat.Tests/Spat.Tests.csproj --verbosity quiet

      - name: Run tests
        run: dotnet run --no-build --project tests/Spat.Tests/Spat.Tests.csproj
